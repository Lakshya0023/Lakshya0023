<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="900" height="230" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9fff0"/>
      <stop offset="0.45" stop-color="#00ff9c"/>
      <stop offset="1" stop-color="#00b36e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  <style>
    text { font-family: 'Arial Black','Impact','Segoe UI',Helvetica,sans-serif; font-weight: 900; font-size: 74px; letter-spacing: 4px; text-anchor: middle; }
    .shine { animation: shine 4s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity:.0 } 50% { opacity:.55 } }
  </style>
  <rect width="900" height="230" fill="none"/>
  <!-- floor shadow -->
  <g opacity=".55" filter="url(#shadow)"><text x="472" y="155" fill="#00ff9c" opacity=".35">LAKSHYA GUPTA</text></g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3.6s" repeatCount="indefinite"/>
    <!-- extrusion (3D depth) -->
    <g>
    <text x="464.4" y="139.4" fill="rgb(0,70,50)">LAKSHYA GUPTA</text>
    <text x="463.5" y="138.5" fill="rgb(0,73,52)">LAKSHYA GUPTA</text>
    <text x="462.6" y="137.6" fill="rgb(0,77,55)">LAKSHYA GUPTA</text>
    <text x="461.7" y="136.7" fill="rgb(0,81,57)">LAKSHYA GUPTA</text>
    <text x="460.8" y="135.8" fill="rgb(0,85,60)">LAKSHYA GUPTA</text>
    <text x="459.9" y="134.9" fill="rgb(0,88,62)">LAKSHYA GUPTA</text>
    <text x="459.0" y="134.0" fill="rgb(0,92,65)">LAKSHYA GUPTA</text>
    <text x="458.1" y="133.1" fill="rgb(0,96,67)">LAKSHYA GUPTA</text>
    <text x="457.2" y="132.2" fill="rgb(0,100,70)">LAKSHYA GUPTA</text>
    <text x="456.3" y="131.3" fill="rgb(0,103,72)">LAKSHYA GUPTA</text>
    <text x="455.4" y="130.4" fill="rgb(0,107,75)">LAKSHYA GUPTA</text>
    <text x="454.5" y="129.5" fill="rgb(0,111,77)">LAKSHYA GUPTA</text>
    <text x="453.6" y="128.6" fill="rgb(0,115,80)">LAKSHYA GUPTA</text>
    <text x="452.7" y="127.7" fill="rgb(0,118,82)">LAKSHYA GUPTA</text>
    <text x="451.8" y="126.8" fill="rgb(0,122,85)">LAKSHYA GUPTA</text>
    <text x="450.9" y="125.9" fill="rgb(0,126,87)">LAKSHYA GUPTA</text>
    
    </g>
    <!-- glowing front face -->
    <g filter="url(#glow)" opacity=".6"><text x="450" y="125" fill="#00ff9c">LAKSHYA GUPTA</text></g>
    <text x="450" y="125" fill="url(#face)" stroke="#eafff7" stroke-width="1.2">LAKSHYA GUPTA</text>
    <text class="shine" x="450" y="125" fill="#ffffff">LAKSHYA GUPTA</text>
  </g>
  <text x="450" y="212" style="font-size:18px;letter-spacing:9px;font-weight:600;font-family:'Courier New',monospace" fill="#00ff9c" opacity=".85">CYBERSECURITY · AI · DEVOPS</text>
</svg>